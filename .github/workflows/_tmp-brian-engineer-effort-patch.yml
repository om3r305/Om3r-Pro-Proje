name: Temporary Brian Engineer Effort Patcher

on:
  push:
    branches: [fix/brian-engineer-copilot-auto-effort-20260913]
    paths:
      - '.github/_tmp-brian-engineer-effort-patch.trigger'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/brian-engineer-copilot-auto-effort-20260913
          fetch-depth: 0
      - name: Remove unsupported effort flags and self-clean
        run: |
          set -euo pipefail
          target='.github/workflows/brian-engineer.yml'
          before="$(grep -o -- '--effort=high' "$target" | wc -l)"
          test "$before" -eq 3
          sed -i 's/ --effort=high//g' "$target"
          after="$(grep -o -- '--effort=high' "$target" | wc -l || true)"
          test "$after" -eq 0
          rm -f .github/workflows/_tmp-brian-engineer-effort-patch.yml
          rm -f .github/_tmp-brian-engineer-effort-patch.trigger
          git config user.name 'brian-ops[bot]'
          git config user.email 'brian-ops@users.noreply.github.com'
          git add -A
          git commit -m 'fix(brian-engineer): let Copilot auto-select effort'
          git push origin HEAD:fix/brian-engineer-copilot-auto-effort-20260913
          git fetch origin brian-2026
          changed="$(git diff --name-only origin/brian-2026...HEAD)"
          test "$changed" = '.github/workflows/brian-engineer.yml'
