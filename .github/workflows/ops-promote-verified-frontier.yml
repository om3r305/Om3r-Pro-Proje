name: Ops Promote Verified Frontier
# Includes prospective outcomes and independent market-radar visibility.

on:
  push:
    branches:
      - brian-2026
    paths:
      - '.github/workflows/ops-promote-verified-frontier.yml'

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROJECT_ID: prj_3uLc3L3N9hMJgUCgzrePkAmDkE9K
      TEAM_ID: team_LFZuncFjJ7gbLY3PuEDN185B
      VERIFIED_SHA: ${{ github.sha }}
    steps:
      - name: Check deployment credential
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN secret is not configured.'
            exit 78
          fi

      - name: Verify scoped project access
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/project.out -w '%{http_code}' \
            "https://api.vercel.com/v9/projects/${PROJECT_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}")
          if [ "$code" != "200" ]; then
            echo "Scoped project access failed with HTTP $code"
            exit 1
          fi
          echo "Scoped project access verified."

      - name: Checkout verified Frontier commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Frontier behavior before publication
        run: |
          node --test tests/frontier-reliability.test.cjs tests/brian-command-model.test.cjs tests/treasury-accounting-model.test.cjs tests/engineering-room-model.test.cjs tests/breaking-scout.test.cjs tests/scout-feed.test.cjs tests/shadow-scorecard.test.cjs
          node --check monster-coins-pro/frontier-v3.js
          node --check monster-coins-pro/frontier-v4.js
          node --check monster-coins-pro/frontier-status-truth.js
          node --check monster-coins-pro/frontier-stability.js
          node --check monster-coins-pro/brian-operations.js
          node --check monster-coins-pro/shadow-scorecard.js

      - name: Link exact Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$PROJECT_ID" > .vercel/project.json

      - name: Deploy verified commit to production
        run: |
          set -euo pipefail
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
