name: Ops Promote Verified Frontier

on:
  push:
    branches:
      - brian-2026
    paths:
      - '.github/workflows/ops-promote-verified-frontier.yml'

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DEPLOYMENT_URL: https://monster-coins-leq6ldkpw-oemer-yildirim.vercel.app
    steps:
      - name: Check deployment credential
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN secret is not configured.'
            exit 78
          fi
      - name: Promote verified canonical Frontier deployment
        run: |
          set -euo pipefail
          npx --yes vercel@latest promote "$DEPLOYMENT_URL" --yes --token "$VERCEL_TOKEN" --scope oemer-yildirim
