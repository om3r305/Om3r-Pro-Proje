name: Ops Promote Verified Frontier

on:
  push:
    branches:
      - brian-2026
    paths:
      - '.github/workflows/ops-promote-verified-frontier.yml'

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROJECT_ID: prj_3uLc3L3N9hMJgUCgzrePkAmDkE9K
      TEAM_ID: team_LFZuncFjJ7gbLY3PuEDN185B
      VERIFIED_SHA: 1c61cc6434f607aba72c11763ab0a8380bb20f46
    steps:
      - name: Check deployment credential
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN secret is not configured.'
            exit 78
          fi

      - name: Verify scoped project access
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/project.out -w '%{http_code}' \
            "https://api.vercel.com/v9/projects/${PROJECT_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}")
          if [ "$code" != "200" ]; then
            echo "Scoped project access failed with HTTP $code"
            exit 1
          fi
          echo "Scoped project access verified."

      - name: Checkout verified Frontier commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 1

      - name: Link exact Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$PROJECT_ID" > .vercel/project.json

      - name: Deploy verified commit to production
        run: |
          set -euo pipefail
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
