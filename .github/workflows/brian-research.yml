name: Brian 2026 Cloud Research

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Research scope
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full-development
          - phase27-development
          - phase28-development
  push:
    branches:
      - brian-2026
    paths:
      - .github/BRIAN_PHASE27_RUN_REQUEST

permissions:
  contents: read

concurrency:
  group: brian-research-${{ github.ref }}-${{ github.event_name }}-${{ inputs.mode || 'phase27-development' }}
  cancel-in-progress: false

jobs:
  research:
    if: github.ref == 'refs/heads/brian-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      BRIAN_RESEARCH_MODE: ${{ github.event_name == 'push' && 'phase27-development' || inputs.mode }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Restore verified research cache
        uses: actions/cache@v4
        with:
          path: research_data
          key: ${{ runner.os }}-brian-research-v2-${{ hashFiles('requirements.txt', 'brian2026/archive.py', 'brian2026/phase24.py', 'brian2026/parquet_store.py') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-brian-research-v2-${{ hashFiles('requirements.txt', 'brian2026/archive.py', 'brian2026/phase24.py', 'brian2026/parquet_store.py') }}-
            ${{ runner.os }}-brian-research-v2-
      - name: Run public-data shadow research
        run: python -m brian2026.cloud_runner --mode "$BRIAN_RESEARCH_MODE"
      - name: Upload review outputs
        uses: actions/upload-artifact@v4
        with:
          name: brian-${{ github.event_name == 'push' && 'phase27-development' || inputs.mode }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            cloud_results/**
            research_data/dataset_manifests/*.json
            research_data/source_gap_evidence/*.json
            research_data/phase25/*.json
            research_data/phase25/equity_curves/*.parquet
            research_data/phase27/*.json
            research_data/phase27/equity_curves/*.parquet
            research_data/phase28/*.json
