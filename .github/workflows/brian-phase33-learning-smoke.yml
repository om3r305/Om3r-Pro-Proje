name: Brian 2026 Phase 3.3 Learning Smoke

on:
  push:
    branches:
      - brian-2026
    paths:
      - .github/BRIAN_PHASE33_SMOKE_RUN_REQUEST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brian-phase33-learning-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/brian-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Restore verified smoke-data cache
        uses: actions/cache@v4
        with:
          path: research_data
          key: ${{ runner.os }}-brian-phase33-smoke-v1-${{ hashFiles('requirements.txt', 'brian2026/archive.py', 'brian2026/phase33_learning_smoke.py') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-brian-phase33-smoke-v1-${{ hashFiles('requirements.txt', 'brian2026/archive.py', 'brian2026/phase33_learning_smoke.py') }}-
            ${{ runner.os }}-brian-phase33-smoke-v1-
      - name: Run verified 100-life learning smoke
        run: >-
          python -m brian2026.phase33_learning_smoke
          --root research_data
          --output cloud_results/phase33_learning_smoke.json
          --checkpoint-output cloud_results/phase33_learner_checkpoint.json
      - name: Upload training diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: brian-phase33-learning-smoke-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            cloud_results/phase33_learning_smoke.json
            cloud_results/phase33_learner_checkpoint.json
            research_data/archive_manifests/*.json
