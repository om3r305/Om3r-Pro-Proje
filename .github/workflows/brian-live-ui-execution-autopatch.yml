name: Brian live UI execution autopatch

on:
  push:
    branches:
      - fix/brian-live-ui-execution-20260906

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/brian-live-ui-execution-20260906
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact source patch
        run: python .github/brian_live_ui_execution_patch.py

      - name: Install focused test runner
        run: python -m pip install pytest

      - name: Focused regression suite
        run: >-
          python -m pytest -q
          tests/test_brian2026_dashboard_mobile_tr.py
          tests/test_brian2026_dip_runtime_stability.py
          tests/test_brian2026_live_ui_execution.py

      - name: Parse modified browser JavaScript
        run: |
          node --check monster-coins-pro/dashboard.js
          node --check monster-coins-pro/dip-expert-v4-runtime-guard.js

      - name: Commit source patch
        run: |
          if git diff --quiet -- monster-coins-pro tests; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monster-coins-pro/dip-expert-v4-runtime-guard.js \
                  monster-coins-pro/dashboard.js \
                  monster-coins-pro/index.html \
                  monster-coins-pro/sw.js \
                  tests/test_brian2026_dashboard_mobile_tr.py \
                  tests/test_brian2026_dip_runtime_stability.py \
                  tests/test_brian2026_live_ui_execution.py
          git commit -m "fix(brian): restore live radar and shadow activity"
          git push origin HEAD:fix/brian-live-ui-execution-20260906
