name: Brian Engineer GPT Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Exact Brian engineering run id'
        required: true
        type: string
      branch_name:
        description: 'Exact candidate branch'
        required: true
        type: string
      head_sha:
        description: 'Exact GPT-approved candidate SHA'
        required: true
        type: string
      base_sha:
        description: 'Exact measured canonical base SHA'
        required: true
        type: string
      pr_number:
        description: 'Exact candidate PR number'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read
  id-token: write

env:
  ENGINEERING_GATEWAY: https://qbcjuxhvhwagvqbjyemo.supabase.co/functions/v1/brian-evolution-engineering-gateway
  ENGINEERING_AUDIENCE: brian-evolution-engineering-v1
  SUPABASE_PROJECT_ID: qbcjuxhvhwagvqbjyemo

concurrency:
  group: brian-engineer-gpt-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RUN_ID: ${{ inputs.run_id }}
      BRANCH_NAME: ${{ inputs.branch_name }}
      HEAD_SHA: ${{ inputs.head_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - name: Validate dispatch identity
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          case "$BRANCH_NAME" in brian-engineer/*) ;; *) echo 'Invalid candidate branch'; exit 1;; esac

      - name: Check out exact GPT-approved candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.1.4'

      - name: Re-run protected-scope guard on approved SHA
        env:
          BRIAN_ENGINEER_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          deno run --allow-env --allow-run --allow-read scripts/brian_engineer_guard.ts | tee /tmp/release-guard.json
          jq -e '.status == "PASS"' /tmp/release-guard.json >/dev/null
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > /tmp/changed.txt
          test -s /tmp/changed.txt || { echo 'Empty release change set'; exit 1; }
          if grep -Eqi '(^|/)(dip|brian[-_]dip)([-_./]|$)' /tmp/changed.txt; then echo 'Protected DIP scope detected'; exit 1; fi
          if grep -Eq '^supabase/migrations/' /tmp/changed.txt; then echo 'Autonomous GPT release may not contain database migrations'; exit 1; fi
          if grep -Eq '^\.github/workflows/' /tmp/changed.txt; then echo 'Autonomous GPT release may not modify its own workflow controls'; exit 1; fi
          if grep -Eq '^monster-coins-pro/' /tmp/changed.txt; then echo 'Autonomous web release is fail-closed while production/base drift exists; DIP isolation is preserved'; exit 1; fi
          if grep -Eq '^vercel\.json$' /tmp/changed.txt; then echo 'Autonomous hosting-control changes are not releasable'; exit 1; fi

      - name: Freeze exact PR and deployment plan
        id: plan
        run: |
          set -euo pipefail
          git fetch origin brian-2026
          current_base="$(git rev-parse origin/brian-2026)"
          test "$current_base" = "$BASE_SHA" || { echo "Canonical base moved: current=$current_base expected=$BASE_SHA"; exit 1; }
          api_pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(printf '%s' "$api_pr" | jq -r '.base.ref')" = 'brian-2026'
          test "$(printf '%s' "$api_pr" | jq -r '.base.sha')" = "$BASE_SHA"
          test "$(printf '%s' "$api_pr" | jq -r '.head.sha')" = "$HEAD_SHA"
          test "$(printf '%s' "$api_pr" | jq -r '.head.ref')" = "$BRANCH_NAME"

          needs_supabase=false
          if grep -Eq '^supabase/functions/' /tmp/changed.txt; then needs_supabase=true; fi
          if [ "$needs_supabase" = true ] && [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo 'SUPABASE_ACCESS_TOKEN is required for backend release'; exit 1
          fi

          : > /tmp/functions-to-deploy.txt
          if [ "$needs_supabase" = true ]; then
            uses_shared=false
            if grep -Eq '^supabase/functions/_shared/' /tmp/changed.txt; then uses_shared=true; fi
            mapfile -t direct_functions < <(sed -nE 's#^supabase/functions/([^/]+)/.*#\1#p' /tmp/changed.txt | grep -Ev '^(_shared|.*[Dd][Ii][Pp].*)$' | sort -u)
            if [ "$uses_shared" = true ]; then
              mapfile -t shared_consumers < <(find supabase/functions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep -E '^(brian-evolution-|brian-world-)' | grep -Evi 'dip' | sort)
            else
              shared_consumers=()
            fi
            printf '%s\n' "${direct_functions[@]}" "${shared_consumers[@]}" | sed '/^$/d' | sort -u > /tmp/functions-to-deploy.txt
            if grep -Eqi 'dip' /tmp/functions-to-deploy.txt; then echo 'Protected DIP function reached plan'; exit 1; fi
          fi
          echo "needs_supabase=$needs_supabase" >> "$GITHUB_OUTPUT"

      - name: Set up Supabase CLI
        if: steps.plan.outputs.needs_supabase == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify GPT approval and exact evidence gate
        id: gate
        run: |
          set -euo pipefail
          oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ENGINEERING_AUDIENCE}")"
          token="$(printf '%s' "$oidc_json" | jq -er '.value')"
          body="$(jq -nc --arg action release_gate --arg branch_name "$BRANCH_NAME" --arg head_sha "$HEAD_SHA" '{action:$action,branch_name:$branch_name,head_sha:$head_sha}')"
          response="$(curl -fsS -X POST "$ENGINEERING_GATEWAY" -H "Authorization: Bearer $token" -H 'content-type: application/json' --data "$body")"
          printf '%s' "$response" | tee /tmp/gpt-release-gate.json
          test "$(jq -r '.status' /tmp/gpt-release-gate.json)" = 'READY'
          test "$(jq -r '.run.run_id' /tmp/gpt-release-gate.json)" = "$RUN_ID"
          test "$(jq -r '.run.commit_sha' /tmp/gpt-release-gate.json)" = "$HEAD_SHA"
          test "$(jq -r '.approval_actor' /tmp/gpt-release-gate.json)" = 'gpt-evidence-gate'

      - name: Reconfirm immutable candidate immediately before merge
        run: |
          set -euo pipefail
          api_pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(printf '%s' "$api_pr" | jq -r '.head.sha')" = "$HEAD_SHA"
          test "$(printf '%s' "$api_pr" | jq -r '.base.sha')" = "$BASE_SHA"
          git fetch origin brian-2026
          test "$(git rev-parse origin/brian-2026)" = "$BASE_SHA"

      - name: Merge only exact GPT-approved SHA
        id: merge
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA"
          git fetch origin brian-2026
          merged_sha="$(git rev-parse origin/brian-2026)"
          test "$merged_sha" != "$BASE_SHA"
          test "$(git rev-parse "$merged_sha^")" = "$BASE_SHA" || { echo 'Unexpected canonical history'; exit 1; }
          echo "sha=$merged_sha" >> "$GITHUB_OUTPUT"

      - name: Deploy only non-DIP changed Supabase functions
        if: steps.plan.outputs.needs_supabase == 'true'
        env:
          MERGED_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          test -s /tmp/functions-to-deploy.txt || { echo 'Backend changed but safe function plan is empty'; exit 1; }
          git checkout "$MERGED_SHA"
          while IFS= read -r fn; do
            test -n "$fn" || continue
            case "$fn" in *[Dd][Ii][Pp]*) echo "Protected function rejected: $fn"; exit 1;; esac
            test -d "supabase/functions/$fn" || { echo "Function directory missing: $fn"; exit 1; }
            supabase functions deploy "$fn" --use-api --project-ref "$SUPABASE_PROJECT_ID"
          done < /tmp/functions-to-deploy.txt

      - name: Record deployment and verify core health
        env:
          MERGED_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ENGINEERING_AUDIENCE}")"
          token="$(printf '%s' "$oidc_json" | jq -er '.value')"
          event(){
            kind="$1"; phase="$2"; payload="$3"
            body="$(jq -nc --arg action event --arg run_id "$RUN_ID" --arg event_kind "$kind" --arg phase "$phase" --arg commit_sha "$MERGED_SHA" --argjson payload "$payload" '{action:$action,run_id:$run_id,event_kind:$event_kind,phase:$phase,commit_sha:$commit_sha,payload:$payload}')"
            response="$(curl -fsS -X POST "$ENGINEERING_GATEWAY" -H "Authorization: Bearer $token" -H 'content-type: application/json' --data "$body")"
            test "$(printf '%s' "$response" | jq -r '.status')" = 'RECORDED'
          }
          event DEPLOYED DEPLOY '{"source":"gpt-evidence-gate","gpt_approved":true,"migrations":false,"web_release":false,"dip_touched":false}'
          heartbeat="$(curl -fsS --retry 5 --retry-delay 3 https://monster-coins-pro-seven.vercel.app/api/brian/brian-frontier-heartbeat-public)"
          test "$(printf '%s' "$heartbeat" | jq -r '.status')" = 'OK'
          test "$(printf '%s' "$heartbeat" | jq -r '.dip_touched')" = 'false'
          event MONITOR_HEALTHY MONITOR '{"status":"HEALTHY","heartbeat_verified":true,"dip_touched":false}'
          event COMPLETE COMPLETE '{"status":"COMPLETE","gpt_approved":true,"rollback_ready":true,"dip_touched":false}'

      - name: Restore previous good SHA on post-merge failure
        if: failure() && steps.merge.outputs.sha != ''
        env:
          FAILED_MERGED_SHA: ${{ steps.merge.outputs.sha }}
          NEEDS_SUPABASE: ${{ steps.plan.outputs.needs_supabase }}
        run: |
          set -euo pipefail
          git fetch origin brian-2026
          current_remote="$(git rev-parse origin/brian-2026)"
          if [ "$current_remote" != "$FAILED_MERGED_SHA" ]; then
            echo "Rollback refused because canonical branch advanced to $current_remote"; exit 1
          fi
          git checkout -B brian-2026 origin/brian-2026
          git config user.name 'brian-engineer-rollback[bot]'
          git config user.email 'brian-engineer-rollback@users.noreply.github.com'
          git revert --no-edit "$FAILED_MERGED_SHA"
          rollback_sha="$(git rev-parse HEAD)"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/brian-2026

          if [ "$NEEDS_SUPABASE" = true ]; then
            test -n "${SUPABASE_ACCESS_TOKEN:-}"
            git checkout "$BASE_SHA"
            while IFS= read -r fn; do
              test -n "$fn" || continue
              case "$fn" in *[Dd][Ii][Pp]*) echo "Rollback plan contained DIP: $fn"; exit 1;; esac
              if [ -d "supabase/functions/$fn" ]; then
                supabase functions deploy "$fn" --use-api --project-ref "$SUPABASE_PROJECT_ID"
              else
                printf 'y\n' | supabase functions delete "$fn" --project-ref "$SUPABASE_PROJECT_ID"
              fi
            done < /tmp/functions-to-deploy.txt
          fi

          oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ENGINEERING_AUDIENCE}")"
          token="$(printf '%s' "$oidc_json" | jq -er '.value')"
          payload="$(jq -nc --arg failed_sha "$FAILED_MERGED_SHA" --arg previous_good_sha "$BASE_SHA" --arg rollback_sha "$rollback_sha" '{status:"ROLLED_BACK",failed_sha:$failed_sha,previous_good_sha:$previous_good_sha,rollback_sha:$rollback_sha,gpt_approved:true,dip_touched:false}')"
          body="$(jq -nc --arg action event --arg run_id "$RUN_ID" --arg phase ROLLBACK --arg event_kind ROLLBACK --arg commit_sha "$rollback_sha" --argjson payload "$payload" '{action:$action,run_id:$run_id,phase:$phase,event_kind:$event_kind,commit_sha:$commit_sha,payload:$payload}')"
          response="$(curl -fsS -X POST "$ENGINEERING_GATEWAY" -H "Authorization: Bearer $token" -H 'content-type: application/json' --data "$body")"
          test "$(printf '%s' "$response" | jq -r '.status')" = 'RECORDED'
