name: Brian Engineer Human Release

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  checks: read
  deployments: read
  id-token: write

env:
  ENGINEERING_GATEWAY: https://qbcjuxhvhwagvqbjyemo.supabase.co/functions/v1/brian-evolution-engineering-gateway
  ENGINEERING_AUDIENCE: brian-evolution-engineering-v1
  SUPABASE_PROJECT_ID: qbcjuxhvhwagvqbjyemo

concurrency:
  group: brian-engineer-human-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.review.state == 'approved' &&
      github.event.review.user.login == github.repository_owner &&
      github.event.pull_request.base.ref == 'brian-2026' &&
      startsWith(github.event.pull_request.head.ref, 'brian-engineer/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out exact approved candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.1.4'

      - name: Re-run protected-scope guard on approved SHA
        env:
          BRIAN_ENGINEER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          deno run --allow-env --allow-run --allow-read scripts/brian_engineer_guard.ts
          if git diff --name-only "$BRIAN_ENGINEER_BASE_SHA...HEAD" | grep -Eqi '(^|/)(dip|brian[-_]dip)([-_./]|$)'; then
            echo 'Protected DIP scope detected at release gate.'
            exit 1
          fi

      - name: Freeze exact base, head and deployment plan before approval
        id: deploy_plan
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch origin brian-2026
          current_base="$(git rev-parse origin/brian-2026)"
          api_pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          api_base="$(printf '%s' "$api_pr" | jq -r '.base.sha')"
          api_head="$(printf '%s' "$api_pr" | jq -r '.head.sha')"
          test "$current_base" = "$EVENT_BASE_SHA" || { echo "Base moved after measurement: current=$current_base measured=$EVENT_BASE_SHA"; exit 1; }
          test "$api_base" = "$EVENT_BASE_SHA" || { echo 'PR base no longer matches measured base'; exit 1; }
          test "$api_head" = "$EVENT_HEAD_SHA" || { echo 'PR head moved after human approval'; exit 1; }
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD_SHA"

          git diff --name-only "$EVENT_BASE_SHA...$EVENT_HEAD_SHA" > /tmp/changed.txt
          test -s /tmp/changed.txt || { echo 'Empty release change set'; exit 1; }
          if grep -Eqi '(^|/)(dip|brian[-_]dip)([-_./]|$)' /tmp/changed.txt; then
            echo 'DIP path reached release plan'; exit 1
          fi
          if grep -Eq '^supabase/migrations/' /tmp/changed.txt; then
            echo 'Autonomous engineering PRs may never contain database migrations.'; exit 1
          fi

          needs_supabase=false
          needs_web=false
          if grep -Eq '^supabase/functions/' /tmp/changed.txt; then needs_supabase=true; fi
          if grep -Eq '^monster-coins-pro/' /tmp/changed.txt; then needs_web=true; fi
          if [ "$needs_supabase" = true ] && [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo 'SUPABASE_ACCESS_TOKEN is required before any backend merge. Release remains fail-closed.'; exit 1
          fi

          : > /tmp/functions-to-deploy.txt
          if [ "$needs_supabase" = true ]; then
            uses_shared=false
            if grep -Eq '^supabase/functions/_shared/' /tmp/changed.txt; then uses_shared=true; fi
            mapfile -t direct_functions < <(sed -nE 's#^supabase/functions/([^/]+)/.*#\1#p' /tmp/changed.txt | grep -Ev '^(_shared|.*[Dd][Ii][Pp].*)$' | sort -u)
            if [ "$uses_shared" = true ]; then
              mapfile -t shared_consumers < <(find supabase/functions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep -E '^(brian-evolution-|brian-world-)' | grep -Evi 'dip' | sort)
            else
              shared_consumers=()
            fi
            printf '%s\n' "${direct_functions[@]}" "${shared_consumers[@]}" | sed '/^$/d' | sort -u > /tmp/functions-to-deploy.txt
            if grep -Eqi 'dip' /tmp/functions-to-deploy.txt; then echo 'Protected DIP function reached deployment plan'; exit 1; fi
          fi

          echo "base_sha=$EVENT_BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$EVENT_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "needs_supabase=$needs_supabase" >> "$GITHUB_OUTPUT"
          echo "needs_web=$needs_web" >> "$GITHUB_OUTPUT"
          echo 'Release plan frozen before human-approval registration.' >> "$GITHUB_STEP_SUMMARY"
          echo "Previous good SHA: $EVENT_BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Approved candidate SHA: $EVENT_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Supabase CLI for backend release and rollback
        if: steps.deploy_plan.outputs.needs_supabase == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Register explicit owner approval and verify all evidence gates
        id: gate
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ steps.deploy_plan.outputs.head_sha }}
        run: |
          set -euo pipefail
          oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ENGINEERING_AUDIENCE}")"
          token="$(printf '%s' "$oidc_json" | jq -r .value)"
          approve="$(jq -nc --arg action human_approve --arg branch_name "$BRANCH_NAME" --arg head_sha "$HEAD_SHA" '{action:$action,branch_name:$branch_name,head_sha:$head_sha}')"
          curl -fsS -X POST "$ENGINEERING_GATEWAY" -H "Authorization: Bearer $token" -H 'content-type: application/json' --data "$approve" | tee /tmp/approval.json
          test "$(jq -r .status /tmp/approval.json)" = 'APPROVED'
          gate="$(jq -nc --arg action release_gate --arg branch_name "$BRANCH_NAME" '{action:$action,branch_name:$branch_name}')"
          curl -fsS -X POST "$ENGINEERING_GATEWAY" -H "Authorization: Bearer $token" -H 'content-type: application/json' --data "$gate" | tee /tmp/release-gate.json
          test "$(jq -r .status /tmp/release-gate.json)" = 'READY'
          echo "run_id=$(jq -r .run.run_id /tmp/release-gate.json)" >> "$GITHUB_OUTPUT"

      - name: Reconfirm immutable PR head immediately before merge
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ steps.deploy_plan.outputs.head_sha }}
          EXPECTED_BASE: ${{ steps.deploy_plan.outputs.base_sha }}
        run: |
          set -euo pipefail
          api_pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(printf '%s' "$api_pr" | jq -r '.head.sha')" = "$EXPECTED_HEAD" || { echo 'PR head changed after approval'; exit 1; }
          test "$(printf '%s' "$api_pr" | jq -r '.base.sha')" = "$EXPECTED_BASE" || { echo 'PR base changed after approval'; exit 1; }
          git fetch origin brian-2026
          test "$(git rev-parse origin/brian-2026)" = "$EXPECTED_BASE" || { echo 'Canonical branch moved after approval'; exit 1; }

      - name: Merge only the measured and owner-approved SHA
        id: merge
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ steps.deploy_plan.outputs.head_sha }}
          PREVIOUS_GOOD_SHA: ${{ steps.deploy_plan.outputs.base_sha }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA"
          git fetch origin brian-2026
          MERGED_SHA="$(git rev-parse origin/brian-2026)"
          test "$MERGED_SHA" != "$PREVIOUS_GOOD_SHA"
          test "$(git rev-parse "$MERGED_SHA^")" = "$PREVIOUS_GOOD_SHA" || { echo 'Unexpected canonical history after squash merge'; exit 1; }
          echo "sha=$MERGED_SHA" >> "$GITHUB_OUTPUT"
          echo "previous_good_sha=$PREVIOUS_GOOD_SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy only non-protected changed Supabase functions
        if: steps.deploy_plan.outputs.needs_supabase == 'true'
        env:
          MERGED_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          test -s /tmp/functions-to-deploy.txt || { echo 'Backend changed but no safe function deployment plan exists'; exit 1; }
          git checkout "$MERGED_SHA"
          while IFS= read -r fn; do
            test -n "$fn" || continue
            case "$fn" in *[Dd][Ii][Pp]*) echo "Protected function rejected: $fn"; exit 1;; esac
            test -d "supabase/functions/$fn" || { echo "Planned function directory missing: $fn"; exit 1; }
            echo "Deploying non-DIP function: $fn"
            supabase functions deploy "$fn" --use-api --project-ref "$SUPABASE_PROJECT_ID"
          done < /tmp/functions-to-deploy.txt

      - name: Wait for production Vercel deployment when web files changed
        if: steps.deploy_plan.outputs.needs_web == 'true'
        env:
          MERGED_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          success=false
          for _ in $(seq 1 72); do
            checks="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$MERGED_SHA/check-runs" 2>/dev/null || echo '{"check_runs":[]}')"
            statuses="$(gh api "repos/$GITHUB_REPOSITORY/commits/$MERGED_SHA/status" 2>/dev/null || echo '{"statuses":[]}')"
            if printf '%s' "$checks" | jq -e '[.check_runs[]? | select((.name|ascii_downcase|contains("vercel")) and .status=="completed" and .conclusion=="success")] | length > 0' >/dev/null; then success=true; break; fi
            if printf '%s' "$statuses" | jq -e '[.statuses[]? | select((.context|ascii_downcase|contains("vercel")) and .state=="success")] | length > 0' >/dev/null; then success=true; break; fi
            if printf '%s' "$checks" | jq -e '[.check_runs[]? | select((.name|ascii_downcase|contains("vercel")) and .status=="completed" and (.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out"))] | length > 0' >/dev/null; then break; fi
            if printf '%s' "$statuses" | jq -e '[.statuses[]? | select((.context|ascii_downcase|contains("vercel")) and (.state=="failure" or .state=="error"))] | length > 0' >/dev/null; then break; fi
            sleep 10
          done
          $success || { echo 'Production Vercel deployment failed or timed out'; exit 1; }

      - name: Record exact deployment
        id: deployed
        env:
          RUN_ID: ${{ steps.gate.outputs.run_id }}
          MERGED_SHA: ${{ steps.merge.outputs.sha }}
          PREVIOUS_GOOD_SHA: ${{ steps.merge.outputs.previous_good_sha }}
        run: |
          set -euo pipefail
          oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ENGINEERING_AUDIENCE}")"
          token="$(printf '%s' "$oidc_json" | jq -r .value)"
          payload="$(jq -nc --arg previous_good_sha "$PREVIOUS_GOOD_SHA" --arg merged_sha "$MERGED_SHA" '{source:"owner-approved-release",previous_good_sha:$previous_good_sha,merged_sha:$merged_sha,migrations:false,dip_touched:false}')"
          body="$(jq -nc --arg action event --arg run_id "$RUN_ID" --arg phase DEPLOY --arg event_kind DEPLOYED --arg commit_sha "$MERGED_SHA" --argjson payload "$payload" '{action:$action,run_id:$run_id,phase:$phase,event_kind:$event_kind,commit_sha:$commit_sha,payload:$payload}')"
          response="$(curl -fsS -X POST "$ENGINEERING_GATEWAY" -H "Authorization: Bearer $token" -H 'content-type: application/json' --data "$body")"
          test "$(printf '%s' "$response" | jq -r .status)" = 'RECORDED'
          echo 'recorded=true' >> "$GITHUB_OUTPUT"

      - name: Monitor deployed Supabase function inventory
        if: steps.deploy_plan.outputs.needs_supabase == 'true'
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID" | tee /tmp/supabase-functions-after-deploy.txt
          while IFS= read -r fn; do
            test -n "$fn" || continue
            grep -Fq "$fn" /tmp/supabase-functions-after-deploy.txt || { echo "Deployed function is absent from Supabase inventory: $fn"; exit 1; }
          done < /tmp/functions-to-deploy.txt

      - name: Record healthy monitor and complete release
        env:
          RUN_ID: ${{ steps.gate.outputs.run_id }}
          MERGED_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ENGINEERING_AUDIENCE}")"
          token="$(printf '%s' "$oidc_json" | jq -r .value)"
          event(){
            kind="$1"; phase="$2"; payload="$3"
            body="$(jq -nc --arg action event --arg run_id "$RUN_ID" --arg event_kind "$kind" --arg phase "$phase" --arg commit_sha "$MERGED_SHA" --argjson payload "$payload" '{action:$action,run_id:$run_id,event_kind:$event_kind,phase:$phase,commit_sha:$commit_sha,payload:$payload}')"
            response="$(curl -fsS -X POST "$ENGINEERING_GATEWAY" -H "Authorization: Bearer $token" -H 'content-type: application/json' --data "$body")"
            test "$(printf '%s' "$response" | jq -r .status)" = 'RECORDED'
          }
          event MONITOR_HEALTHY MONITOR '{"status":"HEALTHY","deployment_inventory_verified":true,"dip_touched":false}'
          event COMPLETE COMPLETE '{"status":"COMPLETE","human_approved":true,"rollback_ready":true}'
          echo 'Brian Engineer release completed with deploy and monitor evidence.' >> "$GITHUB_STEP_SUMMARY"

      - name: Automatically restore the last measured good SHA on post-merge failure
        if: failure() && steps.merge.outputs.sha != ''
        env:
          RUN_ID: ${{ steps.gate.outputs.run_id }}
          FAILED_MERGED_SHA: ${{ steps.merge.outputs.sha }}
          PREVIOUS_GOOD_SHA: ${{ steps.merge.outputs.previous_good_sha }}
          NEEDS_SUPABASE: ${{ steps.deploy_plan.outputs.needs_supabase }}
          NEEDS_WEB: ${{ steps.deploy_plan.outputs.needs_web }}
        run: |
          set -euo pipefail
          echo "Rollback starting: failed=$FAILED_MERGED_SHA previous_good=$PREVIOUS_GOOD_SHA"
          git fetch origin brian-2026
          CURRENT_REMOTE="$(git rev-parse origin/brian-2026)"
          if [ "$CURRENT_REMOTE" != "$FAILED_MERGED_SHA" ]; then
            echo "Automatic rollback refused because canonical branch advanced to $CURRENT_REMOTE after failed release."
            exit 1
          fi

          git checkout -B brian-2026 "origin/brian-2026"
          git config user.name 'brian-engineer-rollback[bot]'
          git config user.email 'brian-engineer-rollback@users.noreply.github.com'
          git revert --no-edit "$FAILED_MERGED_SHA"
          ROLLBACK_SHA="$(git rev-parse HEAD)"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/brian-2026

          if [ "$NEEDS_SUPABASE" = true ]; then
            test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'Cannot restore backend without SUPABASE_ACCESS_TOKEN'; exit 1; }
            git checkout "$PREVIOUS_GOOD_SHA"
            while IFS= read -r fn; do
              test -n "$fn" || continue
              case "$fn" in *[Dd][Ii][Pp]*) echo "Rollback plan contained DIP: $fn"; exit 1;; esac
              if [ -d "supabase/functions/$fn" ]; then
                echo "Restoring non-DIP function from previous good SHA: $fn"
                supabase functions deploy "$fn" --use-api --project-ref "$SUPABASE_PROJECT_ID"
              else
                echo "Removing function introduced only by failed release: $fn"
                printf 'y\n' | supabase functions delete "$fn" --project-ref "$SUPABASE_PROJECT_ID"
              fi
            done < /tmp/functions-to-deploy.txt
          fi

          if [ "$NEEDS_WEB" = true ]; then
            success=false
            for _ in $(seq 1 72); do
              checks="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$ROLLBACK_SHA/check-runs" 2>/dev/null || echo '{"check_runs":[]}')"
              statuses="$(gh api "repos/$GITHUB_REPOSITORY/commits/$ROLLBACK_SHA/status" 2>/dev/null || echo '{"statuses":[]}')"
              if printf '%s' "$checks" | jq -e '[.check_runs[]? | select((.name|ascii_downcase|contains("vercel")) and .status=="completed" and .conclusion=="success")] | length > 0' >/dev/null; then success=true; break; fi
              if printf '%s' "$statuses" | jq -e '[.statuses[]? | select((.context|ascii_downcase|contains("vercel")) and .state=="success")] | length > 0' >/dev/null; then success=true; break; fi
              sleep 10
            done
            $success || { echo 'Rollback commit was pushed but Vercel recovery was not verified'; exit 1; }
          fi

          oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ENGINEERING_AUDIENCE}")"
          token="$(printf '%s' "$oidc_json" | jq -r .value)"
          payload="$(jq -nc --arg failed_sha "$FAILED_MERGED_SHA" --arg previous_good_sha "$PREVIOUS_GOOD_SHA" --arg rollback_sha "$ROLLBACK_SHA" '{status:"ROLLED_BACK",failed_sha:$failed_sha,previous_good_sha:$previous_good_sha,rollback_sha:$rollback_sha,dip_touched:false,database_migration_rollback:false}')"
          body="$(jq -nc --arg action event --arg run_id "$RUN_ID" --arg phase ROLLBACK --arg event_kind ROLLBACK --arg commit_sha "$ROLLBACK_SHA" --argjson payload "$payload" '{action:$action,run_id:$run_id,phase:$phase,event_kind:$event_kind,commit_sha:$commit_sha,payload:$payload}')"
          response="$(curl -fsS -X POST "$ENGINEERING_GATEWAY" -H "Authorization: Bearer $token" -H 'content-type: application/json' --data "$body")"
          test "$(printf '%s' "$response" | jq -r .status)" = 'RECORDED'
          echo "Automatic rollback verified at $ROLLBACK_SHA" >> "$GITHUB_STEP_SUMMARY"
