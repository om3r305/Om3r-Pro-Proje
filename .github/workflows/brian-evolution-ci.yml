name: Brian Evolution OS CI

on:
  pull_request:
    branches:
      - brian-2026
    paths:
      - 'supabase/functions/_shared/evolution_*.ts'
      - 'supabase/functions/_shared/world_brain*.ts'
      - 'supabase/functions/brian-evolution-*/**'
      - 'supabase/functions/brian-world-*/**'
      - 'supabase/migrations/*brian_evolution*.sql'
      - 'supabase/migrations/*brian_world*.sql'
      - 'supabase/migrations/*brian_alpha_intelligence*.sql'
      - 'supabase/migrations/*brian_treasury*.sql'
      - 'monster-coins-pro/evolution.*'
      - 'monster-coins-pro/world.*'
      - 'monster-coins-pro/treasury.*'
      - 'scripts/evolution_candidate_materialize.ts'
      - 'docs/BRIAN_EVOLUTION_OS.md'
      - 'docs/BRIAN_EVOLUTION_LAYER_STATUS.md'
      - 'config/brian-evolution-baseline-v1.json'
      - '.github/workflows/brian-evolution-ci.yml'
      - '.github/workflows/brian-evolution-candidate-materializer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evolution-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.1.4'
      - name: Type-check Evolution shared contracts and cloud entrypoints
        run: >-
          deno check
          supabase/functions/_shared/evolution_contract.ts
          supabase/functions/_shared/evolution_contract.test.ts
          supabase/functions/_shared/evolution_core.ts
          supabase/functions/_shared/evolution_core.test.ts
          supabase/functions/_shared/evolution_research.ts
          supabase/functions/_shared/evolution_research.test.ts
          supabase/functions/_shared/evolution_sandbox.ts
          supabase/functions/_shared/evolution_sandbox.test.ts
          supabase/functions/_shared/evolution_lab.ts
          supabase/functions/_shared/evolution_lab.test.ts
          supabase/functions/_shared/evolution_codegen.ts
          supabase/functions/_shared/evolution_codegen.test.ts
          supabase/functions/_shared/evolution_alpha_intelligence.ts
          supabase/functions/_shared/evolution_alpha_intelligence.test.ts
          supabase/functions/_shared/evolution_treasury.ts
          supabase/functions/_shared/evolution_treasury.test.ts
          supabase/functions/_shared/evolution_treasury_gate.ts
          supabase/functions/_shared/evolution_treasury_gate.test.ts
          supabase/functions/_shared/world_brain.ts
          supabase/functions/_shared/world_brain.test.ts
          supabase/functions/brian-evolution-orchestrator/index.ts
          supabase/functions/brian-evolution-researcher/index.ts
          supabase/functions/brian-evolution-sandbox/index.ts
          supabase/functions/brian-evolution-template-generator/index.ts
          supabase/functions/brian-evolution-experiment-runner/index.ts
          supabase/functions/brian-evolution-promotion-council/index.ts
          supabase/functions/brian-evolution-alpha-edge-challenger/index.ts
          supabase/functions/brian-evolution-alpha-intelligence-status/index.ts
          supabase/functions/brian-evolution-treasury/index.ts
          supabase/functions/brian-evolution-treasury-status/index.ts
          supabase/functions/brian-evolution-status/index.ts
          supabase/functions/brian-evolution-lab-status/index.ts
          supabase/functions/brian-world-brain/index.ts
          supabase/functions/brian-world-discovery-eye/index.ts
          supabase/functions/brian-world-status/index.ts
          scripts/evolution_candidate_materialize.ts
      - name: Run Evolution behavioral tests
        run: >-
          deno test --allow-read
          supabase/functions/_shared/evolution_contract.test.ts
          supabase/functions/_shared/evolution_core.test.ts
          supabase/functions/_shared/evolution_research.test.ts
          supabase/functions/_shared/evolution_sandbox.test.ts
          supabase/functions/_shared/evolution_lab.test.ts
          supabase/functions/_shared/evolution_codegen.test.ts
          supabase/functions/_shared/evolution_alpha_intelligence.test.ts
          supabase/functions/_shared/evolution_treasury.test.ts
          supabase/functions/_shared/evolution_treasury_gate.test.ts
          supabase/functions/_shared/world_brain.test.ts
      - name: Lint Evolution TypeScript
        run: >-
          deno lint
          supabase/functions/_shared/evolution_contract.ts
          supabase/functions/_shared/evolution_contract.test.ts
          supabase/functions/_shared/evolution_core.ts
          supabase/functions/_shared/evolution_core.test.ts
          supabase/functions/_shared/evolution_research.ts
          supabase/functions/_shared/evolution_research.test.ts
          supabase/functions/_shared/evolution_sandbox.ts
          supabase/functions/_shared/evolution_sandbox.test.ts
          supabase/functions/_shared/evolution_lab.ts
          supabase/functions/_shared/evolution_lab.test.ts
          supabase/functions/_shared/evolution_codegen.ts
          supabase/functions/_shared/evolution_codegen.test.ts
          supabase/functions/_shared/evolution_alpha_intelligence.ts
          supabase/functions/_shared/evolution_alpha_intelligence.test.ts
          supabase/functions/_shared/evolution_treasury.ts
          supabase/functions/_shared/evolution_treasury.test.ts
          supabase/functions/_shared/evolution_treasury_gate.ts
          supabase/functions/_shared/evolution_treasury_gate.test.ts
          supabase/functions/_shared/world_brain.ts
          supabase/functions/_shared/world_brain.test.ts
          supabase/functions/brian-evolution-orchestrator/index.ts
          supabase/functions/brian-evolution-researcher/index.ts
          supabase/functions/brian-evolution-sandbox/index.ts
          supabase/functions/brian-evolution-template-generator/index.ts
          supabase/functions/brian-evolution-experiment-runner/index.ts
          supabase/functions/brian-evolution-promotion-council/index.ts
          supabase/functions/brian-evolution-alpha-edge-challenger/index.ts
          supabase/functions/brian-evolution-alpha-intelligence-status/index.ts
          supabase/functions/brian-evolution-treasury/index.ts
          supabase/functions/brian-evolution-treasury-status/index.ts
          supabase/functions/brian-evolution-status/index.ts
          supabase/functions/brian-evolution-lab-status/index.ts
          supabase/functions/brian-world-brain/index.ts
          supabase/functions/brian-world-discovery-eye/index.ts
          supabase/functions/brian-world-status/index.ts
          scripts/evolution_candidate_materialize.ts
      - name: Verify dashboard JavaScript syntax
        run: |
          node --check monster-coins-pro/evolution.js
          node --check monster-coins-pro/world.js
          node --check monster-coins-pro/treasury.js
      - name: Verify no DIP files changed in Evolution PR
        run: |
          git fetch origin brian-2026
          if git diff --name-only origin/brian-2026...HEAD | grep -E '(^|/)(dip|DIP|brian_dip|brian-dip)' ; then
            echo 'Evolution OS must not modify DIP paths'
            exit 1
          fi
      - name: Verify patch formatting
        run: git diff --check origin/brian-2026...HEAD
