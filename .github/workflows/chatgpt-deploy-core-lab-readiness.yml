name: ChatGPT Deploy Core Lab Readiness

on:
  push:
    branches:
      - chatgpt/core-lab-readiness-prod-20260915
    paths:
      - .github/workflows/chatgpt-deploy-core-lab-readiness.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN || secrets.VERCEL_API_TOKEN }}
      VERCEL_TEAM_ID: team_LFZuncFjJ7gbLY3PuEDN185B
      HOTFIX_SHA: b600e1b827023b2881fe7725316e3b3e79dbfe87
    steps:
      - name: Create exact core-only production deployment
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'VERCEL_DEPLOY_RESULT=TOKEN_MISSING'
            exit 2
          fi
          body="$(jq -nc --arg ref "$HOTFIX_SHA" '{name:"monster-coins-pro",target:"production",gitSource:{type:"github",repo:"Om3r-Pro-Proje",org:"om3r305",ref:$ref}}')"
          status="$(curl --silent --show-error --output /tmp/vercel-deploy-response --write-out '%{http_code}' \
            --request POST \
            "https://api.vercel.com/v13/deployments?teamId=${VERCEL_TEAM_ID}&forceNew=1" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$body")"
          echo "VERCEL_DEPLOY_HTTP_STATUS=${status}"
          jq '{id,url,status,readyState,target,error}' /tmp/vercel-deploy-response || cat /tmp/vercel-deploy-response
          case "$status" in
            200|201|202) echo 'VERCEL_DEPLOY_RESULT=STARTED' ;;
            *) echo 'VERCEL_DEPLOY_RESULT=FAILED'; exit 1 ;;
          esac
