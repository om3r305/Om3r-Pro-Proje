name: Brian Engineer Pipeline CI

on:
  pull_request:
    branches: [brian-2026]
    paths:
      - '.github/agents/brian-engineer.agent.md'
      - '.github/workflows/brian-engineer.yml'
      - '.github/workflows/brian-engineer-release.yml'
      - '.github/workflows/brian-engineer-ci.yml'
      - 'scripts/brian_engineer_guard.ts'
      - 'scripts/brian_engineer_gateway.sh'
      - 'scripts/brian_engineer_prompt.py'
      - 'supabase/functions/_shared/evolution_engineer_guard.ts'
      - 'supabase/functions/_shared/evolution_engineer_guard.test.ts'
      - 'supabase/functions/brian-evolution-engineering-gateway/**'
      - 'supabase/migrations/*_brian_evolution_engineering_*.sql'
      - 'tests/test_brian_evolution_engineering_*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.1.4'

      - name: Type-check engineering control plane
        run: >-
          deno check
          supabase/functions/_shared/evolution_engineer_guard.ts
          supabase/functions/_shared/evolution_engineer_guard.test.ts
          scripts/brian_engineer_guard.ts
          supabase/functions/brian-evolution-engineering-gateway/index.ts

      - name: Validate engineering runtime helpers
        run: |
          set -euo pipefail
          bash -n scripts/brian_engineer_gateway.sh
          python3 -m py_compile scripts/brian_engineer_prompt.py
          grep -Fq 'payload="${6:-}"' scripts/brian_engineer_gateway.sh
          if grep -Fq 'payload="${6:-{}}"' scripts/brian_engineer_gateway.sh; then
            echo 'Broken Bash JSON default reintroduced.'
            exit 1
          fi
          # Provider prose formatting is advisory. Execution-grade evidence is the
          # substantive read-only analysis plus the guarded candidate/test pipeline.
          grep -Fq 'analysis_bytes="$(wc -c < /tmp/brian-engineer-analysis.txt)"' scripts/brian_engineer_runner.sh
          grep -Fq 'test "$analysis_bytes" -ge 80' scripts/brian_engineer_runner.sh
          grep -Fq 'Read-only analysis mutated the worktree' scripts/brian_engineer_runner.sh
          grep -Fq 'Agent produced no material change.' scripts/brian_engineer_runner.sh
          grep -Fq 'A changed non-protected replay test is mandatory.' scripts/brian_engineer_runner.sh
          grep -Fq 'A changed adversarial stress test is mandatory.' scripts/brian_engineer_runner.sh

      - name: Run engineering guard behavioral tests
        run: deno test supabase/functions/_shared/evolution_engineer_guard.test.ts

      - name: Lint engineering TypeScript
        run: >-
          deno lint
          supabase/functions/_shared/evolution_engineer_guard.ts
          supabase/functions/_shared/evolution_engineer_guard.test.ts
          scripts/brian_engineer_guard.ts
          supabase/functions/brian-evolution-engineering-gateway/index.ts

      - name: Verify workflow YAML parses
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.safe_load(File.read(f), aliases: true); puts "parsed #{f}" }' \
            .github/workflows/brian-engineer.yml \
            .github/workflows/brian-engineer-release.yml \
            .github/workflows/brian-engineer-ci.yml

      - name: Verify infrastructure PR itself does not touch DIP paths
        run: |
          set -euo pipefail
          git fetch origin brian-2026
          changed="$(git diff --name-only origin/brian-2026...HEAD)"
          if printf '%s\n' "$changed" | grep -Eqi '(^|/)(dip|brian[-_]dip)([-_./]|$)'; then
            echo 'Brian Engineer infrastructure PR touched a protected DIP path:'
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Verify fail-closed invariants remain explicit
        run: |
          set -euo pipefail
          grep -Fq "autonomous_claim_enabled boolean not null default false" supabase/migrations/202609131250_brian_evolution_engineering_pipeline.sql
          grep -Fq "require_human_approval boolean not null default true" supabase/migrations/202609131250_brian_evolution_engineering_pipeline.sql
          grep -Fq "human_approval_status='APPROVED'" supabase/migrations/202609131252_brian_evolution_engineering_hardening.sql
          grep -Fq "github.event.review.user.login == github.repository_owner" .github/workflows/brian-engineer-release.yml
          grep -Fq "Automatic rollback refused because canonical branch advanced" .github/workflows/brian-engineer-release.yml
          if grep -Eqi 'cron\.schedule|activate_evolution_os' supabase/migrations/*_brian_evolution_engineering_*.sql; then
            echo 'Engineering migrations must not self-schedule or activate Evolution OS.'
            exit 1
          fi

  postgres-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      BRIAN_ENGINEER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create only the pre-existing contract required by engineering migrations
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin create role anon; exception when duplicate_object then null; end $$;
          do $$ begin create role authenticated; exception when duplicate_object then null; end $$;
          do $$ begin create role service_role; exception when duplicate_object then null; end $$;
          create table public.brian_evolution_codegen_requests (
            request_id text primary key,
            candidate_id text not null,
            hypothesis_id text not null,
            requested_at timestamptz not null,
            parent_commit text not null,
            branch_name text not null,
            changed_paths text[] not null default '{}',
            objective text not null,
            constraints text[] not null default '{}',
            success_criteria text[] not null default '{}',
            evidence_refs text[] not null default '{}',
            contamination_declaration text,
            external_generator_required boolean not null default true,
            required_human_review boolean not null default true,
            metadata jsonb not null default '{}'::jsonb,
            evidence_class text not null default 'POINT_IN_TIME',
            shadow_only boolean not null default true,
            live_execution boolean not null default false,
            autonomous_apply_allowed boolean not null default false,
            created_at timestamptz not null default now()
          );
          SQL

      - name: Apply engineering migrations on PostgreSQL 16
        run: |
          set -euo pipefail
          for migration in $(printf '%s\n' supabase/migrations/*_brian_evolution_engineering_*.sql | sort); do
            echo "Applying $migration"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Run real lifecycle, rollback and queue tests
        run: |
          python -m pip install -q pytest psycopg2-binary
          python -m pytest -q tests/test_brian_evolution_engineering_*.py -v

      - name: Verify service-role-only RPC grants
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -At <<'SQL' > /tmp/grants.txt
          select routine_name || ':' || grantee || ':' || privilege_type
          from information_schema.routine_privileges
          where routine_schema='public'
            and routine_name in ('claim_engineering_task','record_engineering_event','measure_engineering_run','approve_engineering_run')
          order by routine_name,grantee,privilege_type;
          SQL
          cat /tmp/grants.txt
          if grep -E ':(PUBLIC|anon|authenticated):EXECUTE$' /tmp/grants.txt; then
            echo 'Untrusted role can execute engineering RPC.'
            exit 1
          fi
          for fn in claim_engineering_task record_engineering_event measure_engineering_run approve_engineering_run; do
            grep -Fq "$fn:service_role:EXECUTE" /tmp/grants.txt || { echo "service_role grant missing for $fn"; exit 1; }
          done
