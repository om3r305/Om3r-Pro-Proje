name: Vercel Promote Recovery

on:
  push:
    branches: [brian-2026]
    paths:
      - '.github/workflows/vercel-promote-recovery.yml'

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Promote verified V8.3 deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          PROJECT_ID: prj_3uLc3L3N9hMJgUCgzrePkAmDkE9K
          TEAM_ID: team_LFZuncFjJ7gbLY3PuEDN185B
          DEPLOYMENT_ID: dpl_6m96Gzk7ju7mQyKK61b2uc4QaTgZ
        shell: bash
        run: |
          set -euo pipefail
          token="${VERCEL_TOKEN:-${VERCEL_ACCESS_TOKEN:-}}"
          if [ -z "$token" ]; then
            echo "NO_VERCEL_TOKEN_SECRET"
            exit 2
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            "https://api.vercel.com/v10/projects/${PROJECT_ID}/promote/${DEPLOYMENT_ID}?teamId=${TEAM_ID}" \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            --data '{}'
          echo
          echo "PROMOTE_OK"
