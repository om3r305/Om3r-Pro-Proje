name: Brian 2026 Phase 3.5 Training

on:
  push:
    branches:
      - brian-2026
    paths:
      - .github/BRIAN_PHASE35_RUN_REQUEST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brian-phase35-training
  cancel-in-progress: false

jobs:
  train:
    if: github.ref == 'refs/heads/brian-2026'
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt

      - name: Restore verified Phase 3.5 archive cache
        uses: actions/cache@v4
        with:
          path: research_data
          key: ${{ runner.os }}-brian-phase35-v1-${{ hashFiles('brian2026/archive.py', 'brian2026/phase35_training.py') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-brian-phase35-v1-${{ hashFiles('brian2026/archive.py', 'brian2026/phase35_training.py') }}-
            ${{ runner.os }}-brian-phase34-profit-v1-
            ${{ runner.os }}-brian-phase33-smoke-v1-

      - name: Run locked 1,000-life shadow training
        run: python -m brian2026.phase35_training

      - name: Upload Phase 3.5 training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brian-phase35-training-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            cloud_results/phase35_training_summary.json
            cloud_results/phase35_training_checkpoint.json
            cloud_results/phase35_training_progress.json
            research_data/archive_manifests/*.json
