name: Brian 2026 CI

on:
  push:
    branches:
      - brian-2026
  pull_request:
    branches:
      - brian-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/brian-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run full test suite
        run: python -m pytest -q
      - name: Compile project Python
        run: python -m compileall -q -x '(^|/)(.venv|research_data)/' .
      - name: Verify legacy imports
        run: python -c "import main; import core.bot"
      - name: Verify clean patch formatting
        run: git diff --check
      - name: Verify Brian is hard shadow only
        run: >-
          python -c "from brian2026.engine import BrianEngine;
          engine=BrianEngine({'shadow_only':False});
          assert engine.shadow_only is True;
          forbidden={'buy','sell','place_order','create_order','execute_order','submit_order'};
          assert not forbidden.intersection(dir(engine))"

  verify-edge-functions:
    # Executes the actual deployed Supabase edge-function TS logic (type-check + behavioral
    # tests). Separate job from `verify` so the existing Python pipeline above is untouched.
    # brian-2026 issue #32: pin Deno to the version the hosted Supabase Edge Runtime is
    # currently compatible with (Edge Runtime v1.69.4 / Deno v2.1.4, per Supabase's own
    # changelog: https://supabase.com/changelog/37941-all-regions-now-run-deno-2-1-compatible-release),
    # not the latest Deno release, so CI reflects what actually runs in production.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/brian-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.1.4"
      - name: Type-check intrabar-eye pure logic module and entrypoint
        run: >-
          deno check
          supabase/functions/brian-intrabar-eye/logic.ts
          supabase/functions/brian-intrabar-eye/index.ts
          supabase/functions/brian-intrabar-eye/logic.test.ts
      - name: Run behavioral Deno tests (consensus, late-chase, signal helpers, micro-book accounting)
        run: deno test --allow-read supabase/functions/brian-intrabar-eye
      - name: Lint changed edge-function TS
        run: >-
          deno lint
          supabase/functions/brian-intrabar-eye/logic.ts
          supabase/functions/brian-intrabar-eye/index.ts
          supabase/functions/brian-intrabar-eye/logic.test.ts
