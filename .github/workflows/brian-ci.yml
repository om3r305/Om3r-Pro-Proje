name: Brian 2026 CI

on:
  push:
    branches:
      - brian-2026
  pull_request:
    branches:
      - brian-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/brian-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run full test suite
        run: python -m pytest -q
      - name: Compile project Python
        run: python -m compileall -q -x '(^|/)(.venv|research_data)/' .
      - name: Verify legacy imports
        run: python -c "import main; import core.bot"
      - name: Verify clean patch formatting
        run: git diff --check
      - name: Verify Brian is hard shadow only
        run: >-
          python -c "from brian2026.engine import BrianEngine;
          engine=BrianEngine({'shadow_only':False});
          assert engine.shadow_only is True;
          forbidden={'buy','sell','place_order','create_order','execute_order','submit_order'};
          assert not forbidden.intersection(dir(engine))"

  verify-edge-functions:
    # Executes the actual Supabase edge-function TS logic (type-check + behavioral tests).
    # Deno stays pinned to the hosted Supabase-compatible version used by this project.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/brian-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.1.4"
      - name: Type-check edge-function entrypoints and shared modules
        run: >-
          deno check
          supabase/functions/_shared/collector_lease.ts
          supabase/functions/_shared/collector_lease.test.ts
          supabase/functions/_shared/l2_book.ts
          supabase/functions/_shared/l2_book.test.ts
          supabase/functions/_shared/emergent_mover.ts
          supabase/functions/_shared/emergent_mover.test.ts
          supabase/functions/_shared/emergent_mover_coverage.ts
          supabase/functions/_shared/emergent_mover_coverage.test.ts
          supabase/functions/brian-intrabar-eye/logic.ts
          supabase/functions/brian-intrabar-eye/index.ts
          supabase/functions/brian-intrabar-eye/logic.test.ts
          supabase/functions/brian-sensor-mesh/index.ts
          supabase/functions/brian-universe-collector/index.ts
          supabase/functions/brian-emergent-mover/index.ts
          supabase/functions/brian-derivatives-eye/index.ts
          supabase/functions/brian-fx-eye/index.ts
          supabase/functions/brian-news-eye/index.ts
      - name: Run behavioral Deno tests
        run: >-
          deno test --allow-read
          supabase/functions/_shared
          supabase/functions/brian-intrabar-eye
      - name: Lint edge-function TS
        run: >-
          deno lint
          supabase/functions/_shared/collector_lease.ts
          supabase/functions/_shared/collector_lease.test.ts
          supabase/functions/_shared/l2_book.ts
          supabase/functions/_shared/l2_book.test.ts
          supabase/functions/_shared/emergent_mover.ts
          supabase/functions/_shared/emergent_mover.test.ts
          supabase/functions/_shared/emergent_mover_coverage.ts
          supabase/functions/_shared/emergent_mover_coverage.test.ts
          supabase/functions/brian-intrabar-eye/logic.ts
          supabase/functions/brian-intrabar-eye/index.ts
          supabase/functions/brian-intrabar-eye/logic.test.ts
          supabase/functions/brian-sensor-mesh/index.ts
          supabase/functions/brian-universe-collector/index.ts
          supabase/functions/brian-emergent-mover/index.ts
          supabase/functions/brian-derivatives-eye/index.ts
          supabase/functions/brian-fx-eye/index.ts
          supabase/functions/brian-news-eye/index.ts

  verify-collector-lease:
    # Real Postgres validates both the lease primitive and new append-only market-data stores.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/brian-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Postgres integration test dependencies
        run: python -m pip install pytest psycopg2-binary
      - name: Run real Postgres concurrency and migration-integrity tests
        env:
          BRIAN_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: >-
          python -m pytest -q
          tests/test_brian2026_collector_lease_postgres.py
          tests/test_brian2026_emergent_mover_postgres.py
          -v
