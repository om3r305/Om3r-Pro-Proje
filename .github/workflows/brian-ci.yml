name: Brian 2026 CI

on:
  push:
    branches:
      - brian-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/brian-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run full test suite
        run: python -m pytest -q
      - name: Compile project Python
        run: python -m compileall -q -x '(^|/)(.venv|research_data)/' .
      - name: Verify legacy imports
        run: python -c "import main; import core.bot"
      - name: Verify clean patch formatting
        run: git diff --check
      - name: Verify Brian is hard shadow only
        run: >-
          python -c "from brian2026.engine import BrianEngine;
          engine=BrianEngine({'shadow_only':False});
          assert engine.shadow_only is True;
          forbidden={'buy','sell','place_order','create_order','execute_order','submit_order'};
          assert not forbidden.intersection(dir(engine))"
