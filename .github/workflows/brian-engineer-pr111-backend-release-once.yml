name: Brian Engineer PR111 Backend Release Once

on:
  push:
    branches: [brian-2026]
    paths:
      - '.github/workflows/brian-engineer-pr111-backend-release-once.yml'

permissions:
  contents: read

env:
  SUPABASE_PROJECT_ID: qbcjuxhvhwagvqbjyemo
  RELEASE_SOURCE_SHA: 3890577757c5d787c961dc848e67526857648104

jobs:
  deploy:
    if: github.repository_owner == 'om3r305'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out exact reviewed merge source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify exact source and fail closed
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'SUPABASE_ACCESS_TOKEN missing'; exit 1; }

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy only allowlisted non-DIP shared consumers
        run: |
          set -euo pipefail
          functions=(
            brian-evolution-alpha-edge-challenger
            brian-evolution-alpha-intelligence-status
            brian-evolution-engineering-gateway
            brian-evolution-experiment-runner
            brian-evolution-lab-status
            brian-evolution-ocean-control
            brian-evolution-ocean-status
            brian-evolution-ocean-worker
            brian-evolution-orchestrator
            brian-evolution-promotion-council
            brian-evolution-researcher
            brian-evolution-sandbox
            brian-evolution-status
            brian-evolution-template-generator
            brian-evolution-treasury-status
            brian-evolution-treasury
            brian-world-brain
            brian-world-discovery-eye
            brian-world-status
          )
          for fn in "${functions[@]}"; do
            case "$fn" in *[Dd][Ii][Pp]*) echo "Protected DIP name rejected: $fn"; exit 1;; esac
            test -d "supabase/functions/$fn" || { echo "Missing function directory: $fn"; exit 1; }
            echo "Deploying $fn from $RELEASE_SOURCE_SHA"
            supabase functions deploy "$fn" --use-api --project-ref "$SUPABASE_PROJECT_ID"
          done

      - name: Verify deployed inventory
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID" | tee /tmp/functions.txt
          functions=(
            brian-evolution-alpha-edge-challenger
            brian-evolution-alpha-intelligence-status
            brian-evolution-engineering-gateway
            brian-evolution-experiment-runner
            brian-evolution-lab-status
            brian-evolution-ocean-control
            brian-evolution-ocean-status
            brian-evolution-ocean-worker
            brian-evolution-orchestrator
            brian-evolution-promotion-council
            brian-evolution-researcher
            brian-evolution-sandbox
            brian-evolution-status
            brian-evolution-template-generator
            brian-evolution-treasury-status
            brian-evolution-treasury
            brian-world-brain
            brian-world-discovery-eye
            brian-world-status
          )
          for fn in "${functions[@]}"; do grep -Fq "$fn" /tmp/functions.txt || { echo "Missing deployed function: $fn"; exit 1; }; done
          if grep -E 'Deploying .*([Dd][Ii][Pp])' "$GITHUB_STEP_SUMMARY" 2>/dev/null; then exit 1; fi
          echo 'PR111 non-DIP backend release inventory verified.' >> "$GITHUB_STEP_SUMMARY"
