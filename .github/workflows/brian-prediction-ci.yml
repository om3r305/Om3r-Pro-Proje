name: Brian Prediction Intelligence CI

on:
  pull_request:
    branches:
      - brian-2026
    paths:
      - 'supabase/functions/_shared/prediction_*.ts'
      - 'supabase/functions/brian-prediction-eye/**'
      - 'supabase/functions/brian-prediction-status/**'
      - 'supabase/functions/brian-niulai4-pilot-ingest/**'
      - 'supabase/migrations/*brian_niulai4_*.sql'
      - 'tests/test_brian_niulai4_*postgres.py'
      - 'supabase/migrations/*brian_status_read_load*.sql'
      - 'supabase/functions/brian-frontier-engineering-status/**'
      - 'tests/test_brian_status_read_load_*.py'
      - 'docs/BRIAN_PREDICTION_UI_CONTRACT.md'
      - 'supabase/migrations/*brian_prediction_*.sql'
      - 'tests/test_brian_prediction_*postgres.py'
      - 'research/niulai4_pilot/**'
      - 'docs/BRIAN_PREDICTION_INTELLIGENCE.md'
      - '.github/workflows/brian-prediction-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prediction-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.1.4'

      - name: Type-check Prediction Intelligence modules
        run: >-
          deno check
          supabase/functions/_shared/prediction_*.ts
          supabase/functions/brian-prediction-eye/index.ts
          supabase/functions/brian-prediction-status/index.ts
          supabase/functions/brian-niulai4-pilot-ingest/index.ts

      - name: Type-check and test the local NIULAI4 pilot (no network)
        run: |
          deno check research/niulai4_pilot/*.ts
          deno test --allow-read --allow-write research/niulai4_pilot/pilot_test.ts

      - name: Run offline behavioral tests (no network, live smoke test stays skipped)
        run: deno test supabase/functions/_shared/prediction_*.test.ts

  verify-prediction-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Postgres test dependencies
        run: python -m pip install pytest psycopg2-binary
      - name: Run real Postgres migration, grant and append-only tests
        env:
          BRIAN_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest -q tests/test_brian_prediction_postgres.py tests/test_brian_prediction_retention_postgres.py tests/test_brian_prediction_schedule_postgres.py tests/test_brian_prediction_changes_postgres.py tests/test_brian_prediction_resolutions_postgres.py tests/test_brian_niulai4_pilot_ingest_postgres.py tests/test_brian_status_read_load_postgres.py tests/test_brian_status_read_load_static.py -v
