name: Temporary Evolution Parent Config Patch

on:
  push:
    branches:
      - fix/brian-evolution-parent-config-20260912

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[parent-config-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/brian-evolution-parent-config-20260912
          fetch-depth: 0
      - name: Apply bounded parent-config hotfix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          sandbox = Path('supabase/functions/brian-evolution-sandbox/index.ts')
          src = sandbox.read_text(encoding='utf-8')
          old = '''function parentCommit(): string {
            const value = (Deno.env.get("BRIAN_EVOLUTION_PARENT_COMMIT") ?? "").trim();
            if (!value) throw new Error("EVOLUTION_PARENT_COMMIT_MISSING");
            if (!/^[0-9a-f]{40}$/i.test(value)) throw new Error("EVOLUTION_PARENT_COMMIT_INVALID");
            return value.toLowerCase();
          }'''
          new = '''async function parentCommit(): Promise<string> {
            const configured = (Deno.env.get("BRIAN_EVOLUTION_PARENT_COMMIT") ?? "").trim();
            if (configured) {
              if (!/^[0-9a-f]{40}$/i.test(configured)) throw new Error("EVOLUTION_PARENT_COMMIT_INVALID");
              return configured.toLowerCase();
            }
            const q = await db.from("brian_evolution_runtime_config")
              .select("config_value")
              .eq("config_key", "canonical_parent_commit")
              .single();
            if (q.error || !q.data) throw new Error("EVOLUTION_PARENT_COMMIT_MISSING");
            const value = String(q.data.config_value ?? "").trim();
            if (!value) throw new Error("EVOLUTION_PARENT_COMMIT_MISSING");
            if (!/^[0-9a-f]{40}$/i.test(value)) throw new Error("EVOLUTION_PARENT_COMMIT_INVALID");
            return value.toLowerCase();
          }'''
          if old not in src:
              raise SystemExit('parentCommit block did not match expected canonical source')
          src = src.replace(old, new, 1)
          old_call = 'const canonicalParent = parentCommit();'
          if old_call not in src:
              raise SystemExit('parentCommit call did not match expected canonical source')
          src = src.replace(old_call, 'const canonicalParent = await parentCommit();', 1)
          sandbox.write_text(src, encoding='utf-8')

          migration = Path('supabase/migrations/202609121720_brian_evolution_runtime_parent_config.sql')
          migration.write_text('''-- Evolution runtime-owned canonical parent pointer. MAIN/ALPHA only; DIP untouched.\n-- Service-role workers may read it, but only database-owner rollout tooling may mutate it.\n\ncreate table if not exists public.brian_evolution_runtime_config (\n  config_key text primary key,\n  config_value text not null,\n  updated_at timestamptz not null default now(),\n  constraint brian_evolution_runtime_parent_sha_guard check (\n    config_key <> 'canonical_parent_commit' or config_value ~ '^[0-9a-fA-F]{40}$'\n  )\n);\n\nalter table public.brian_evolution_runtime_config enable row level security;\nrevoke all on public.brian_evolution_runtime_config from anon, authenticated;\nrevoke insert, update, delete, truncate, references, trigger on public.brian_evolution_runtime_config from service_role;\ngrant select on public.brian_evolution_runtime_config to service_role;\n''', encoding='utf-8')

          test = Path('tests/test_brian_evolution_parent_config.py')
          test.write_text('''from pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nSANDBOX = (ROOT / "supabase/functions/brian-evolution-sandbox/index.ts").read_text(encoding="utf-8")\nMIGRATION = (ROOT / "supabase/migrations/202609121720_brian_evolution_runtime_parent_config.sql").read_text(encoding="utf-8")\n\ndef test_sandbox_falls_back_to_owner_managed_canonical_parent_config():\n    assert 'async function parentCommit(): Promise<string>' in SANDBOX\n    assert 'brian_evolution_runtime_config' in SANDBOX\n    assert '.eq("config_key", "canonical_parent_commit")' in SANDBOX\n    assert 'const canonicalParent = await parentCommit();' in SANDBOX\n    assert 'EVOLUTION_PARENT_COMMIT_MISSING' in SANDBOX\n    assert 'EVOLUTION_PARENT_COMMIT_INVALID' in SANDBOX\n\ndef test_runtime_parent_config_is_read_only_to_service_role():\n    lower = MIGRATION.lower()\n    assert 'grant select on public.brian_evolution_runtime_config to service_role' in lower\n    assert 'revoke insert, update, delete, truncate, references, trigger on public.brian_evolution_runtime_config from service_role' in lower\n    assert "config_value ~ '^[0-9a-fa-f]{40}$'" in lower\n''', encoding='utf-8')
          PY
          rm .github/workflows/tmp-parent-config-patch.yml
          git diff --check
          git status --short
      - name: Commit bounded hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/brian-evolution-sandbox/index.ts \
                  supabase/migrations/202609121720_brian_evolution_runtime_parent_config.sql \
                  tests/test_brian_evolution_parent_config.py \
                  .github/workflows/tmp-parent-config-patch.yml
          git commit -m "fix(evolution): add owner-managed canonical parent fallback [parent-config-applied]"
          git push origin HEAD:fix/brian-evolution-parent-config-20260912
