name: Brian dashboard health autopatch

on:
  push:
    branches:
      - fix/brian-dashboard-health-20260906
    paths:
      - .github/brian_dashboard_health_patch.py
      - .github/workflows/brian-dashboard-health-autopatch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/brian-dashboard-health-20260906
          fetch-depth: 0

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Apply exact dashboard health patch
        run: python .github/brian_dashboard_health_patch.py

      - name: Run focused dashboard tests
        run: python -m pytest -q tests/test_brian2026_dashboard_mobile_tr.py

      - name: Parse dashboard JavaScript
        run: node --check monster-coins-pro/dashboard.js

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit source-only patch
        shell: bash
        run: |
          if git diff --quiet -- supabase/functions/brian-control-center/index.ts tests/test_brian2026_dashboard_mobile_tr.py; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/brian-control-center/index.ts tests/test_brian2026_dashboard_mobile_tr.py
          git commit -m "fix(brian): use canonical dashboard health probes"
          git push origin HEAD:fix/brian-dashboard-health-20260906
