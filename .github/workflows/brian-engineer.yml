name: Brian Engineer

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Optional exact Evolution codegen request id'
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write
  checks: read
  id-token: write
  copilot-requests: write

concurrency:
  group: brian-engineer-production-queue
  cancel-in-progress: false

env:
  ENGINEERING_GATEWAY: https://qbcjuxhvhwagvqbjyemo.supabase.co/functions/v1/brian-evolution-engineering-gateway
  ENGINEERING_AUDIENCE: brian-evolution-engineering-v1

jobs:
  engineer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out canonical Brian branch
        uses: actions/checkout@v4
        with:
          ref: brian-2026
          fetch-depth: 0

      - name: Check Brian Engineer queue
        id: preflight
        shell: bash
        run: |
          set +e
          oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ENGINEERING_AUDIENCE}")"
          token="$(printf '%s' "$oidc_json" | jq -er '.value')"
          response="$(curl -fsS -X POST "$ENGINEERING_GATEWAY" -H "Authorization: Bearer $token" -H 'content-type: application/json' --data '{"action":"preflight"}')"
          rc=$?
          if [ "$rc" -ne 0 ] || [ -z "$response" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Brian Engineer preflight unavailable; deferring safely without consuming a worker." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          should_run="$(printf '%s' "$response" | jq -r '.should_run // false')"
          reason="$(printf '%s' "$response" | jq -r '.reason // "UNKNOWN"')"
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "Brian Engineer preflight: should_run=$should_run reason=$reason" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Deno
        if: steps.preflight.outputs.should_run == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.1.4'

      - name: Set up Python
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GitHub Copilot CLI
        if: steps.preflight.outputs.should_run == 'true'
        run: npm install -g @github/copilot@latest

      - name: Prepare quota-independent local AI fallback
        if: steps.preflight.outputs.should_run == 'true'
        env:
          EXTERNAL_OPENAI_KEY: ${{ secrets.BRIAN_OPENAI_API_KEY }}
          OLLAMA_VERSION: v0.34.0
          OLLAMA_ARCHIVE_SHA256: cf95886728959aa09910bb34de5cca1cc5a8f68003b5597197d3f2c2d57c0804
          OLLAMA_HOST: 127.0.0.1:11434
          OLLAMA_CONTEXT_LENGTH: '8192'
          OLLAMA_NUM_PARALLEL: '1'
          OLLAMA_MODELS: ${{ runner.temp }}/brian-ollama-models
        run: |
          set -euo pipefail
          if [ -n "$EXTERNAL_OPENAI_KEY" ]; then
            echo 'External OpenAI-compatible BYOK is configured; local Ollama bootstrap is not needed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/ollama-linux-amd64.tar.zst \
            "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
          echo "${OLLAMA_ARCHIVE_SHA256}  /tmp/ollama-linux-amd64.tar.zst" | sha256sum -c -
          sudo tar --zstd -xf /tmp/ollama-linux-amd64.tar.zst -C /usr/local
          ollama --version

          mkdir -p "$OLLAMA_MODELS"
          nohup env OLLAMA_HOST="$OLLAMA_HOST" OLLAMA_CONTEXT_LENGTH="$OLLAMA_CONTEXT_LENGTH" OLLAMA_NUM_PARALLEL="$OLLAMA_NUM_PARALLEL" OLLAMA_MODELS="$OLLAMA_MODELS" ollama serve >/tmp/brian-ollama.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS "http://${OLLAMA_HOST}/api/tags" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "http://${OLLAMA_HOST}/api/tags" >/dev/null
          OLLAMA_HOST="$OLLAMA_HOST" OLLAMA_MODELS="$OLLAMA_MODELS" ollama pull qwen2.5-coder:1.5b
          echo 'Quota-independent local fallback ready: Ollama qwen2.5-coder:1.5b.' >> "$GITHUB_STEP_SUMMARY"

      - name: Run Brian Engineer provider-continuity pipeline
        if: steps.preflight.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          REQUEST_ID: ${{ inputs.request_id || '' }}
          BRIAN_OPENAI_API_KEY: ${{ secrets.BRIAN_OPENAI_API_KEY || 'ollama-local' }}
          BRIAN_OPENAI_BASE_URL: ${{ secrets.BRIAN_OPENAI_BASE_URL || 'http://127.0.0.1:11434/v1' }}
          BRIAN_OPENAI_MODEL: ${{ vars.BRIAN_OPENAI_MODEL || 'qwen2.5-coder:1.5b' }}
          BRIAN_ANTHROPIC_API_KEY: ${{ secrets.BRIAN_ANTHROPIC_API_KEY }}
          BRIAN_ANTHROPIC_BASE_URL: ${{ secrets.BRIAN_ANTHROPIC_BASE_URL }}
          BRIAN_ANTHROPIC_MODEL: ${{ vars.BRIAN_ANTHROPIC_MODEL }}
          BRIAN_HOSTED_ATTEMPT_TIMEOUT_SECONDS: '120'
          BRIAN_BYOK_ATTEMPT_TIMEOUT_SECONDS: '180'
          BRIAN_LOCAL_ATTEMPT_TIMEOUT_SECONDS: '150'
        run: bash scripts/brian_engineer_runner.sh
