name: Brian Engineer

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Optional exact Evolution codegen request id'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read
  id-token: write
  copilot-requests: write
  models: read

concurrency:
  group: brian-engineer-production-queue
  cancel-in-progress: false

env:
  ENGINEERING_GATEWAY: https://qbcjuxhvhwagvqbjyemo.supabase.co/functions/v1/brian-evolution-engineering-gateway
  ENGINEERING_AUDIENCE: brian-evolution-engineering-v1

jobs:
  engineer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out canonical Brian branch
        uses: actions/checkout@v4
        with:
          ref: brian-2026
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.1.4'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot@latest

      - name: Run Brian Engineer provider-continuity pipeline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          REQUEST_ID: ${{ inputs.request_id || '' }}
          BRIAN_OPENAI_API_KEY: ${{ secrets.BRIAN_OPENAI_API_KEY }}
          BRIAN_OPENAI_BASE_URL: ${{ secrets.BRIAN_OPENAI_BASE_URL }}
          BRIAN_OPENAI_MODEL: ${{ vars.BRIAN_OPENAI_MODEL }}
          BRIAN_ANTHROPIC_API_KEY: ${{ secrets.BRIAN_ANTHROPIC_API_KEY }}
          BRIAN_ANTHROPIC_BASE_URL: ${{ secrets.BRIAN_ANTHROPIC_BASE_URL }}
          BRIAN_ANTHROPIC_MODEL: ${{ vars.BRIAN_ANTHROPIC_MODEL }}
        run: bash scripts/brian_engineer_runner.sh
