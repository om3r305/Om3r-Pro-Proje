name: ChatGPT Promote GPT Approval UI Hotfix

on:
  push:
    branches:
      - chatgpt/gpt-approval-ui-prod-hotfix
    paths:
      - .github/workflows/chatgpt-promote-gpt-ui-hotfix.yml

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN || secrets.VERCEL_API_TOKEN }}
      VERCEL_DEPLOYMENT_URL: https://monster-coins-n04s4lf6e-oemer-yildirim.vercel.app
      VERCEL_SCOPE: oemer-yildirim
    steps:
      - name: Promote exact verified preview
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'VERCEL_PROMOTE_RESULT=TOKEN_MISSING'
            exit 2
          fi
          npx --yes vercel@latest promote "$VERCEL_DEPLOYMENT_URL" \
            --yes \
            --timeout 5m \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"
          echo 'VERCEL_PROMOTE_RESULT=SUCCESS'
