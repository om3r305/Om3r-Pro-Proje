name: Brian ALPHA v2 CI

on:
  pull_request:
    branches:
      - brian-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpha-deno:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.1.4"
      - name: Type-check ALPHA v2 modules and entrypoints
        run: >-
          deno check
          supabase/functions/_shared/dynamic_cost.ts
          supabase/functions/_shared/dynamic_cost.test.ts
          supabase/functions/_shared/alpha_decision.ts
          supabase/functions/_shared/alpha_decision.test.ts
          supabase/functions/brian-alpha-decision-compiler/index.ts
          supabase/functions/brian-missed-opportunity-auditor/index.ts
          supabase/functions/brian-official-macro-eye/index.ts
      - name: Run ALPHA v2 behavioral tests
        run: >-
          deno test --allow-read
          supabase/functions/_shared/dynamic_cost.test.ts
          supabase/functions/_shared/alpha_decision.test.ts
      - name: Lint ALPHA v2 TypeScript
        run: >-
          deno lint
          supabase/functions/_shared/dynamic_cost.ts
          supabase/functions/_shared/dynamic_cost.test.ts
          supabase/functions/_shared/alpha_decision.ts
          supabase/functions/_shared/alpha_decision.test.ts
          supabase/functions/brian-alpha-decision-compiler/index.ts
          supabase/functions/brian-missed-opportunity-auditor/index.ts
          supabase/functions/brian-official-macro-eye/index.ts
      - name: Verify clean patch formatting
        run: git diff --check

  alpha-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Postgres test dependencies
        run: python -m pip install pytest psycopg2-binary
      - name: Run ALPHA v2 migration integrity tests
        env:
          BRIAN_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest -q tests/test_brian2026_alpha_decision_postgres.py -v
