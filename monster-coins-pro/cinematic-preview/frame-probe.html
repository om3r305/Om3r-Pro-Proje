<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>BRIAN / Native frame probe</title><style>body{background:#020b0a;color:#a3eed2;font:16px Consolas,monospace;padding:40px}button{font:inherit;padding:12px;background:#12392c;color:white;border:1px solid #46ba8d}pre{white-space:pre-wrap}#dot{width:20px;height:20px;background:#7dffd4;box-shadow:0 0 25px #3affbd;margin:30px 0}</style><h1>BRIAN / FRAME PROBE</h1><p>WebGL ve ağ isteği yok. Gerçek requestAnimationFrame çağrılarını sayar.</p><button id="start">15 saniye ölç</button><div id="dot"></div><pre id="result">Ölçüm bekleniyor.</pre><script>let start=null,frames=0,last=0,gaps=[],done=false;document.getElementById('start').onclick=()=>{start=performance.now();frames=0;last=0;gaps=[];done=false;document.getElementById('result').textContent='Ölçülüyor…';};function step(t){requestAnimationFrame(step);document.getElementById('dot').style.transform='translateX('+(Math.sin(t/600)*100+100)+'px)';if(start===null||done)return;frames++;if(last)gaps.push(t-last);last=t;if(t-start>=15000){done=true;const duration=t-start,r={durationMs:duration,rafCallbacks:frames,rafFps:frames/(duration/1000),meanGapMs:gaps.reduce((s,v)=>s+v,0)/gaps.length,maxGapMs:Math.max(...gaps),visibility:document.visibilityState,focused:document.hasFocus(),viewport:[innerWidth,innerHeight],dpr:devicePixelRatio};document.getElementById('result').textContent=JSON.stringify(r,null,2);}}requestAnimationFrame(step);</script></html>
