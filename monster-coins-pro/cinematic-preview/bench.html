<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>BRIAN · ölçüm kafesi</title><style>body{margin:0;background:#05111e;color:#deefff;font:13px system-ui}header{padding:10px;position:sticky;top:0;background:#082033;z-index:10;display:flex;gap:16px;align-items:center}select{font:inherit;padding:7px}iframe{border:0;display:block}p{margin:0;color:#a6c2d8}</style></head><body><header><b>İZOLE RENDER ÖLÇÜM KAFESİ</b><select aria-label="Test çözünürlüğü" id="size"><option>5120×1440</option><option>3840×1080</option><option>3440×1440</option><option>1920×1080</option></select><button id="start">15 sn ölçümü başlat</button><p>Iframe'in gerçek layout boyutu sabittir. Dış tarayıcıda kırpılma, fiziksel tam ekran testi değildir.</p></header><pre id="report" style="padding:10px;max-width:1100px;white-space:pre-wrap">Ölçüm bekleniyor.</pre><iframe title="BRIAN cinematic ölçüm sahnesi" src="index.html" width="5120" height="1440"></iframe><script>document.getElementById('size').onchange=e=>{const[w,h]=e.target.value.split('×').map(Number),f=document.querySelector('iframe');f.width=w;f.height=h;};document.getElementById('start').onclick=()=>{document.getElementById('report').textContent='Ölçülüyor…';document.querySelector('iframe').contentWindow.postMessage({type:'brian-preview-start-benchmark'},location.origin)};window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===document.querySelector('iframe').contentWindow&&e.data?.type==='brian-preview-result')document.getElementById('report').textContent=JSON.stringify(e.data.report,null,2)});</script></body></html>
