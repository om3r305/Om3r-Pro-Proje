<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020712">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brian Frontier OS">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/logo.svg">
<link rel="apple-touch-icon" href="/logo.svg">
<link rel="stylesheet" href="/frontier-v3.css?v=20260912-u3">
<link rel="stylesheet" href="/frontier-v4-mobile-rescue.css?v=20260913-r2">
<style>.dev-ring{position:relative}</style>
<title>Brian Frontier OS — Otonom Komuta Merkezi</title>
</head>
<body>
<div style="min-height:100vh;display:grid;place-items:center;background:#020712;color:#8ceeff;font-family:system-ui">Brian Frontier V4 yükleniyor…</div>
<script>
(async()=>{
  try{
    const r=await fetch('/frontier-v3.html',{cache:'no-store'});
    if(!r.ok) throw new Error('base dashboard '+r.status);
    const html=await r.text();
    const doc=new DOMParser().parseFromString(html,'text/html');
    doc.querySelectorAll('script').forEach(s=>s.remove());
    document.body.innerHTML=doc.body.innerHTML;

    const nativeFetch=window.fetch.bind(window);
    const timedFetch=(url,init,timeoutMs,reason)=>{
      const controller=new AbortController();
      let signal=controller.signal;
      if(init?.signal && typeof AbortSignal.any==='function') signal=AbortSignal.any([init.signal,controller.signal]);
      const timer=setTimeout(()=>controller.abort(reason),timeoutMs);
      return nativeFetch(url,{...init,signal}).finally(()=>clearTimeout(timer));
    };
    window.fetch=(input,init={})=>{
      const url=typeof input==='string'?input:String(input?.url||'');
      const publicHeartbeatPath='/api/brian/brian-frontier-heartbeat-public';
      if(url===publicHeartbeatPath || url.endsWith(publicHeartbeatPath)){
        const direct='https://qbcjuxhvhwagvqbjyemo.supabase.co/functions/v1/brian-frontier-heartbeat-public';
        const heartbeatInit={...init,method:'GET',headers:{accept:'application/json'},body:undefined,cache:'no-store'};
        return timedFetch(direct,heartbeatInit,12000,'BRIAN_HEARTBEAT_DIRECT_TIMEOUT')
          .catch(()=>timedFetch(publicHeartbeatPath,heartbeatInit,8000,'BRIAN_HEARTBEAT_PROXY_TIMEOUT'));
      }
      const marker='.supabase.co/functions/v1/';
      if(!url.includes(marker)) return nativeFetch(input,init);
      const isDevelopment=url.includes('/brian-development-status');
      const isHeartbeat=url.includes('/brian-frontier-heartbeat');
      const isEngineering=url.includes('/brian-frontier-engineering-status');
      const directTimeout=isDevelopment?45000:isHeartbeat?30000:isEngineering?30000:20000;
      const suffix=url.slice(url.indexOf(marker)+marker.length);
      const proxyUrl=`/api/brian/${suffix}`;
      return timedFetch(input,init,directTimeout,isDevelopment?'BRIAN_DEVELOPMENT_DIRECT_TIMEOUT':isHeartbeat?'BRIAN_HEARTBEAT_DIRECT_TIMEOUT':isEngineering?'BRIAN_ENGINEERING_DIRECT_TIMEOUT':'BRIAN_API_DIRECT_TIMEOUT')
        .catch((directError)=>timedFetch(proxyUrl,init,8000,'BRIAN_PROXY_TIMEOUT').catch(()=>{throw directError}));
    };

    const load=(src)=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.body.appendChild(s)});
    await load('/frontier-v3.js?v=20260912-u3');
    await load('/frontier-v4.js?v=20260912-a1');
    await load('/frontier-engineer-console.js?v=20260914-e3');
    await load('/frontier-engineering-room-v2.js?v=20260914-r1');
    await load('/frontier-gpt-approval-ui.js?v=20260915-gpt1');
    await load('/frontier-stability.js?v=20260914-s2');
    await load('/frontier-status-truth.js?v=20260914-t4');
    await load('/brain-anatomy-model.js?v=20260915-living1');
    await load('/brain-anatomy-v2.js?v=20260916-mobile3');
    await load('/lab-readiness-v1.js?v=20260915-lr1');
    await load('/frontier-v4-mobile-rescue.js?v=20260913-r3');
    await load('/frontier-meeting-v5.js?v=20260914-m1');
    await load('/frontier-meeting-v6-state.js?v=20260915-council2');
    await load('/frontier-meeting-v6.js?v=20260915-council2');
    await load('/frontier-meeting-v7-model.js?v=20260916-1');
    await load('/frontier-meeting-v7.js?v=20260916-1');
    await load('/frontier-meeting-v8-shadow-ledger.js?v=20260916-shadow2');
  }catch(e){
    document.body.innerHTML='<div style="padding:24px;color:#ff8d99;background:#020712;font-family:system-ui"><h2>Brian V4 yüklenemedi</h2><pre style="white-space:pre-wrap">'+String(e)+'</pre></div>';
  }
})();
</script>
</body>
</html>
